<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131419">
  <title>Send to TesPlay</title>
  <link rel="stylesheet" href="/tesplay/launcher.css">
  <script type="module" src="/tesplay/send.js"></script>
</head>
<body>
  <main class="shell sender">
    <header class="masthead"><h1>Send to TesPlay</h1></header>
    <section class="card always">
      <form id="send-form">
        <label for="send-url">Paste a link</label>
        <input id="send-url" type="url" placeholder="https://…" inputmode="url" autocomplete="off" required>
        <div class="actions"><button class="primary" type="submit">Send to car</button></div>
      </form>
      <p id="send-status" class="hint" role="status"></p>
    </section>
  </main>
</body>
</html>
