services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    depends_on:
      - backend
      - media
    security_opt:
      - no-new-privileges:true
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      HTTP_WORKERS: "2"
      PROXY_PART: ${PUBLIC_URL:-https://tesplay.sachabc.com}/proxy
      API_URL: ${PUBLIC_URL:-https://tesplay.sachabc.com}/api
      FRONTEND_URL: ${PUBLIC_URL:-https://tesplay.sachabc.com}
      REQWEST_PROXY: http://100.68.93.61:8888
      BG_HELPER_URL: http://bg-helper:3000
      PLAYER_N_DECODER_URL: http://player-decoder:3001
      SPONSORBLOCK_SERVERS: https://sponsor.ajay.app
      DISABLE_RYD: "true"
      DISABLE_LBRY: "true"
      DISABLE_PUBSUB: "true"
      HIBERNATE__CONNECTION__URL: jdbc:postgresql://postgres:5432/piped
      HIBERNATE__CONNECTION__DRIVER_CLASS: org.postgresql.Driver
      HIBERNATE__DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HIBERNATE__CONNECTION__USERNAME: piped
      HIBERNATE__CONNECTION__PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-}
    security_opt:
      - no-new-privileges:true
  media:
    image: ghcr.io/noahbroyles/piped-proxy@sha256:fff997355bab19ad8c5ec7139e594e194546ffc06644b9011f427ee56f830983
    restart: unless-stopped
    environment:
      PROXY: http://100.68.93.61:8888
      PROXY_PUBLIC_URL: ${PUBLIC_URL:-https://tesplay.sachabc.com}/proxy
    security_opt:
      - no-new-privileges:true
  bg-helper:
    image: ghcr.io/noahbroyles/bg-helper-server@sha256:de1385ed40ab921ab108f8eb7ae4cdb785af7f9beed46a8316225c852049ad2c
    restart: unless-stopped
    environment:
      HTTPS_PROXY: http://100.68.93.61:8888
      HTTP_PROXY: http://100.68.93.61:8888
    security_opt:
      - no-new-privileges:true
  player-decoder:
    image: ghcr.io/noahbroyles/piped-player-n-decoder@sha256:b7d0aa5b5ac47d3eff62a563db1d52c84ecc05721e3dab7f6d89d147650584eb
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: piped
      POSTGRES_USER: piped
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-}
    volumes:
      - piped-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piped -d piped"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
volumes:
  piped-db:
